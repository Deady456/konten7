niche: "fakta sains dan pengetahuan umum yang mengejutkan (alam semesta, tubuh manusia, sejarah, hewan, teknologi)"
audience: "orang dewasa Indonesia yang penasaran dan suka belajar hal baru"
language: id

# ============================================================
# NEW: Content safety & quality settings
# ============================================================
ai_disclosure:
  enabled: true
  text: "Konten ini dibuat dengan bantuan AI dan telah ditinjau oleh manusia."
  # Posisi: "description_only" atau "description_and_title"
  position: "description_only"

content_variation:
  enabled: true
  # Format yang bisa dipilih: list, story, comparison, myth_busting
  formats: ["list", "story", "comparison", "myth_busting"]
  # Minimal variasi format setiap 5 video
  min_format_switch: 5

review:
  # Mode: "auto" (langsung upload), "draft" (simpan draft dulu), "hybrid" (draft tiap 5 video)
  mode: "auto"
  draft_dir: "drafts"
  # Auto approve kalau score >= threshold
  auto_approve_score: 7

script:
  model: Meta-Llama-3.1-70B-Instruct
  target_seconds: 80
  words_per_second: 2.5
  # NEW: SEO & uniqueness
  seo:
    enabled: true
    min_title_length: 40
    max_title_length: 95
    trending_boost: true
  # NEW: Fact check
  fact_check:
    enabled: true
    require_sources: false

voice:
  provider: elevenlabs
  elevenlabs_model: eleven_multilingual_v2
  # Voice variety - 2 pria saja, konsisten
  variety:
    enabled: true
    voices:
      - edge_id: "id-ID-ArdiNeural"
        elevenlabs_id: "VR6AewLTigWG4xSOukaG"
        name: "Arnold"
        gender: "male"
      - edge_id: "id-ID-ArdiNeural"
        elevenlabs_id: "ErXwobaYiN019PkySvjV"
        name: "Jaka"
        gender: "male"
    strategy: "round_robin"
  # Legacy (fallback kalau variety disabled)
  voice: id-ID-ArdiNeural
  elevenlabs_voice_id: VR6AewLTigWG4xSOukaG



branding:
  enabled: true
  # Intro: video pendek di awal
  intro:
    enabled: false
    path: "assets/branding/intro.mp4"
    duration: 2.5
  # Outro: video CTA di akhir
  outro:
    enabled: true
    path: "assets/branding/outro.mp4"
    duration: 3.0
    cta_text: "Subscribe untuk fakta unik lainnya!"
  # Watermark
  watermark:
    enabled: true
    path: "assets/branding/watermark.png"
    position: "center"
    opacity: 0.6
    size: 300

captions:
  whisper_model: base
  font: "Anton"
  font_size:  110
  primary_color: "&H0000FFFF"
  outline_color: "&H00000000"
  outline: 6
  words_per_caption: 1
  position_y: 0.55

video:
  width: 1080
  height: 1920
  fps: 30

upload:
  privacy: "public"
  category_id: "27"
  made_for_kids: false
  channel: "kasusmisteri"
  default_tags: ["fakta unik", "pengetahuan", "edukasi", "fakta sains", "alam liar", "hewan unik", "fakta menarik", "sains viral", "fakta"]
  # NEW: Upload schedule
  schedule:
    enabled: true
    # Jam upload optimal (WIB)
    optimal_hours: [11, 13, 17, 19, 21]
    # Max video per hari
    max_per_day: 2
    # Delay antar video (menit)
    delay_minutes: 120
  tiktok:
    enabled: true
hook_text:
  enabled: true
  font: "Anton"
  font_size:  110
  color: "white"
  outline_color: "&H00000000"
  outline: 4
  position: "center"
  duration: 3
